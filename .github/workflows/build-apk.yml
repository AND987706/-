name: 构建 AutoTap APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出项目
        uses: actions/checkout@v7

      - name: 设置 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 下载打包工具 JAR
        run: |
          set -e
          curl -fL --retry 3 -o apkbuilder-cli.jar \
            https://github.com/Steven-Qiang/AutoJs6-ApkBuilder/releases/download/v1.1.0/apkbuilder-cli.jar
          ls -lh apkbuilder-cli.jar

      - name: 下载 AutoJs6 模板 APK（锁定兼容版本 v6.7.0）
        run: |
          set -e
          curl -fL --retry 3 -o autojs6.apk \
            https://github.com/SuperMonster003/AutoJs6/releases/download/v6.7.0/autojs6-v6.7.0-universal-047ae62e.apk
          ls -lh autojs6.apk

      - name: 打包脚本为独立 APK
        run: |
          set -e
          java -jar apkbuilder-cli.jar -a autojs6.apk -s ./source -o AutoTap.apk
          ls -lh AutoTap.apk

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v7
        with:
          name: AutoTap-APK
          path: AutoTap.apk
          if-no-files-found: error
